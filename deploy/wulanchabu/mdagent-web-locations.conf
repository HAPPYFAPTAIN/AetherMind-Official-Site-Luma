location = /official/md-agent/open {
    access_log off;
    proxy_pass https://127.0.0.1:8081/mdagent/web/open;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_redirect / /official/md-agent/;
}
location = /official/md-agent {
    return 308 /official/md-agent/;
}
location = /official/md-agent/ {
    proxy_pass https://127.0.0.1:8081/;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
    proxy_intercept_errors on;
    error_page 401 403 = @mdagent_reentry;
    proxy_redirect / /official/md-agent/;
}
location @mdagent_reentry {
    return 302 /official/console/;
}
location ^~ /official/md-agent/ {
    proxy_pass https://127.0.0.1:8081/;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
    proxy_redirect / /official/md-agent/;
}
location ^~ /api/ {
    proxy_pass https://127.0.0.1:8081/api/;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
}
location ^~ /assets/ {
    proxy_pass https://127.0.0.1:8081/assets/;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
}
# Plugin boot revisions and the /plugins/events stream must come from the
# same tenant as the HTML, not a frozen copy in web-preview.
location ^~ /plugins/ {
    proxy_pass https://127.0.0.1:8081/plugins/;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
}
location = /manifest.webmanifest {
    proxy_pass https://127.0.0.1:8081/manifest.webmanifest;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
}
location = /favicon.svg {
    proxy_pass https://127.0.0.1:8081/favicon.svg;
    include /etc/nginx/snippets/mdagent-web-proxy.conf;
}
