# Included by the official virtual host's dsh locations. The 8081 gateway
# validates the web session and routes only to that user's loopback instance.
include /etc/nginx/snippets/mdagent-web-origin-guard.conf;
proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name 8.130.144.193;
proxy_ssl_verify off;
proxy_set_header Host 8.130.144.193:8081;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $mdagent_web_connection;
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
add_header Cache-Control "no-store" always;
add_header Referrer-Policy "no-referrer" always;
