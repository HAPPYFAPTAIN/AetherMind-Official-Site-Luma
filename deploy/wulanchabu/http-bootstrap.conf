# Temporary HTTP vhost for ACME bootstrap; replaced by official.conf after TLS.
server {
    listen 80;
    listen [::]:80;
    server_name 8.130.144.193;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/aethericai-official.access.log;
    error_log /var/log/nginx/aethericai-official.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aethericai-official/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/snippets/aethericai-official-locations.conf;
}
