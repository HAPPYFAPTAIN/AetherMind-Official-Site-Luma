server {
    listen 80;
    listen [::]:80;
    server_name 8.130.144.193;
    server_tokens off;
    access_log /var/log/nginx/aethericai-official.access.log;
    error_log /var/log/nginx/aethericai-official.error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/aethericai-official/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://8.130.144.193$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 8.130.144.193;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/aethericai-official-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethericai-official-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AETHERICAI_OFFICIAL_TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/aethericai-official.access.log;
    error_log /var/log/nginx/aethericai-official.error.log warn;
    include /etc/nginx/snippets/aethericai-official-locations.conf;
}
