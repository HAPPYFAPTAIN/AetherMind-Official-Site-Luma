# Included only inside the official site's own IP virtual host.
location = / {
    return 302 /official/;
}
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "aethericai-official ok\n";
}
location = /llmer-api/api/v1/community {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/community;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location ^~ /llmer-api/api/v1/community/ {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/community/;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location ^~ /llmer-api/api/v1/auth/sms/ {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/auth/sms/;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location = /llmer-api/api/v1/auth/refresh {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/auth/refresh;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location = /llmer-api/api/v1/auth/logout {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/auth/logout;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location = /llmer-api/api/v1/me/avatar {
    client_max_body_size 3m;
    proxy_pass https://123.57.30.164/llmer-api/api/v1/me/avatar;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location ^~ /llmer-api/api/v1/avatars/ {
    proxy_pass https://123.57.30.164/llmer-api/api/v1/avatars/;
    include /etc/nginx/snippets/aethericai-community-proxy.conf;
}
location ^~ /llmer-api/ {
    return 404;
}
location = /official {
    return 308 /official/;
}
location = /community { return 302 /official/community/; }
location = /community/ { return 302 /official/community/; }
location ^~ /official/ {
    alias /opt/aethericai-official/current/out/;
    index index.html;
    charset utf-8;
    autoindex off;
    try_files $uri $uri/ =404;
    limit_except GET HEAD { deny all; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
location / {
    return 404;
}
