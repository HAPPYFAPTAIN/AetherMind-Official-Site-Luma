# Session authentication and public-origin checks precede loopback translation.
map $http_upgrade $mdagent_web_connection {
    default upgrade;
    '' close;
}
map $http_host $mdagent_web_host_allowed {
    default 0;
    8.130.144.193 1;
    8.130.144.193:443 1;
    8.130.144.193:8081 1;
}
map $http_origin $mdagent_web_origin_allowed {
    default 0;
    '' 1;
    https://8.130.144.193 1;
    https://8.130.144.193:443 1;
    https://8.130.144.193:8081 1;
}
map $http_sec_fetch_site $mdagent_web_fetch_allowed {
    default 0;
    '' 1;
    same-origin 1;
    same-site 1;
    none 1;
}
server {
    listen 8081 ssl;
    server_name 8.130.144.193;
    ssl_certificate /etc/letsencrypt/live/aethericai-official-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aethericai-official-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    include /etc/nginx/snippets/mdagent-api-only.conf;

    location = /mdagent/web/open {
        access_log off;
        include /etc/nginx/snippets/mdagent-web-origin-guard.conf;
        proxy_pass http://127.0.0.1:8090/web/open;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location = /_agent_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/v1/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_read_timeout 100s;
    }
    location / {
        include /etc/nginx/snippets/mdagent-web-origin-guard.conf;
        auth_request /_agent_auth;
        auth_request_set $mdagent_web_port $upstream_http_x_upstream_port;
        proxy_pass http://127.0.0.1:$mdagent_web_port;
        proxy_http_version 1.1;
        # dsh's privileged RPCs require loopback Host/Origin. Translate only
        # after the public origin and account-scoped session checks above.
        proxy_set_header Host 127.0.0.1:$mdagent_web_port;
        proxy_set_header Origin "";
        proxy_set_header Sec-Fetch-Site "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mdagent_web_connection;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        error_page 401 = @mdagent_entry_required;
    }
    location @mdagent_entry_required {
        default_type text/html;
        charset utf-8;
        return 403 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MD Agent</title><p>请从官网控制台重新进入 MD EXP。</p></html>';
    }
}
