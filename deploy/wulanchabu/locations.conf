# Learn Everything is a private Gradio service.  The official API signs a
# short-lived entry ticket after checking the product entitlement; this
# auth_request gate also protects every HTML, asset and websocket request.
location = /_official-learn-authorize {
    internal;
    proxy_pass http://127.0.0.1:18030/api/v1/console/learn-everything/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location = /official/learn-everything {
    return 308 /official/learn-everything/;
}
location = /official/learn-everything/ {
    auth_request /_official-learn-authorize;
    auth_request_set $learn_entry_cookie $upstream_http_x_learn_entry_cookie;
    add_header Set-Cookie $learn_entry_cookie always;
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /official/learn-everything;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location ^~ /official/learn-everything/ {
    auth_request /_official-learn-authorize;
    proxy_pass http://127.0.0.1:7860/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /official/learn-everything;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
location = /community { return 302 /official/community/; }
location = /community/ { return 302 /official/community/; }
location ^~ /official/ {
    alias /opt/aethericai-official/current/out/;
    index index.html;
    charset utf-8;
    autoindex off;
    try_files $uri $uri/ =404;
    limit_except GET HEAD { deny all; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
location / {
    return 404;
}
